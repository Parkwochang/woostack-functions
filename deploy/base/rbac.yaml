apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: functions-api
  namespace: functions
rules:
  - apiGroups:
      - serving.knative.dev
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: functions-api
  namespace: functions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: functions-api
subjects:
  - kind: ServiceAccount
    name: functions-api
    namespace: functions-system
