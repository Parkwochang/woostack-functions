apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: functions-api-ingress
  namespace: functions-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: functions-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              platform.woostack.dev/functions-management: "true"
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: function-ingress
  namespace: functions
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: woostack-functions
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: knative-serving
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kourier-system
