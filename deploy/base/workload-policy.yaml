apiVersion: v1
kind: LimitRange
metadata:
  name: function-container-defaults
  namespace: functions
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 32Mi
      default:
        cpu: 250m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 1Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: function-capacity
  namespace: functions
spec:
  hard:
    count/pods: "50"
    count/services.serving.knative.dev: "30"
    requests.cpu: "4"
    requests.memory: 4Gi
    requests.ephemeral-storage: 2Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    limits.ephemeral-storage: 4Gi
