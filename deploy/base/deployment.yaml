apiVersion: apps/v1
kind: Deployment
metadata:
  name: functions-api
  namespace: functions-system
  labels:
    app.kubernetes.io/name: functions-api
    app.kubernetes.io/part-of: woostack-functions
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: functions-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: functions-api
        app.kubernetes.io/part-of: woostack-functions
    spec:
      serviceAccountName: functions-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: harbor.woostack.dev/woostack/functions-api:0.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: FUNCTION_NAMESPACE
              value: functions
            - name: FUNCTION_SERVICE_ACCOUNT
              value: function-runtime
            - name: FUNCTION_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: functions-api-auth
                  key: token
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
